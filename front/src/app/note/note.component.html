<div class="note-card">
  <a class="note-link" [routerLink]="['/notes', note.id]">
    <p class="note-title">{{ note.title }}</p>
    <p class="note-preview">{{ note.content | slice:0:80 }}{{ note.content.length > 80 ? '…' : '' }}</p>
  </a>
  <button type="button" class="delete-btn" (click)="onDelete($event)"
          [attr.aria-label]="'Supprimer la note « ' + note.title + ' »'">✕</button>
</div>
