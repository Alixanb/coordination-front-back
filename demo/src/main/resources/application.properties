server.port=9090

# CORS : origines autorisées (liste séparée par des virgules). Restreint volontairement
# au frontend Angular local plutôt qu'un joker "*" (durcissement OWASP A05).
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
